<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SamuBookMarker 书签同步</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <p class="preview-banner" id="preview-banner" hidden>
      预览模式：未检测到扩展环境，以下为示例数据
    </p>

    <header class="head">
      <h1 class="head-title">SamuBookMarker 书签同步</h1>
      <p class="head-sub">通过私有 Gist 手动同步书签</p>
    </header>

    <section class="card status" aria-label="同步状态">
      <div class="status-row">
        <span class="status-label">最后同步</span>
        <span class="status-value" id="last-sync">尚未同步</span>
      </div>
      <div class="status-row status-row--top">
        <span class="status-label">上次结果</span>
        <div class="summary" id="summary">
          <span class="summary-empty">暂无记录</span>
        </div>
      </div>
      <p class="running" id="running-flag" hidden>同步中…</p>
      <p class="error-bar" id="error-bar" hidden>
        <span id="error-text"></span>
      </p>
    </section>

    <form class="card form" id="settings-form" autocomplete="off" novalidate>
      <label class="field">
        <span class="field-label">
          <span>GitHub Token</span>
          <span class="field-state" id="token-state" hidden></span>
        </span>
        <input class="field-input" id="token" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span class="field-label">
          <span>加密口令</span>
          <span class="field-state" id="passphrase-state" hidden></span>
        </span>
        <input class="field-input" id="passphrase" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span class="field-label">Gist ID</span>
        <input class="field-input" id="gist-id" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span class="field-label">设备名</span>
        <input class="field-input" id="device-name" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field field--inline">
        <input class="field-check" id="pull-only" type="checkbox" />
        <span class="field-check-label">仅拉取：只更新本机书签，不上传改动</span>
      </label>

      <div class="actions">
        <button class="btn btn--ghost" id="save-btn" type="submit">保存设置</button>
        <button class="btn btn--primary" id="sync-btn" type="button">立即同步</button>
      </div>
      <p class="feedback" id="feedback" role="status" hidden></p>
    </form>

    <details class="card logs" id="logs">
      <summary class="logs-summary" id="log-count">同步日志（0）</summary>
      <ul class="log-list" id="log-list"></ul>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
